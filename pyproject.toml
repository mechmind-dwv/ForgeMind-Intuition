[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgemind"
version = "0.8.0"
description = "Experimental compositional hypothesis discovery and falsification engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "mechmind-dwv"}
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
