[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgemind"
version = "0.16.0"
description = "Explainable experimental intuition for program synthesis and coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "mechmind-dwv"}
]
dependencies = []

[project.scripts]
forgemind = "forgemind.cli:main"

[tool.setuptools.packages.find]
include = ["forgemind*"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "build>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30"
]
vectorized = [
    "numpy>=1.26"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
