name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-vectorized:
    name: Python 3.12 · vectorized extra
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with test and vectorized extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,vectorized]"

      - name: Verify NumPy and package import
        run: |
          python -c "import numpy as np; print(f'NumPy {np.__version__}')"
          python -c "from forgemind import BlockExactHypothesisSet, VectorizedHypothesisStore; print('Vectorized API import: OK')"

      - name: Run full test suite
        run: python -m pytest -q
